name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Verify no uncommitted changes
        run: |
          git diff --exit-code || (echo "Uncommitted changes detected" && exit 1)

  build-release-apk:
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          APK="rozgar-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          TAG="latest-apk"
          # Recreate the rolling release so the tag + APK always match this commit.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 3  # let tag deletion propagate before recreating
          gh release create "$TAG" "$APK" \
            --title "Latest Release APK (v${VERSION})" \
            --notes "Auto-built from main on $(date -u +%Y-%m-%d). Commit: ${GITHUB_SHA:0:7}" \
            --target "$GITHUB_SHA"
